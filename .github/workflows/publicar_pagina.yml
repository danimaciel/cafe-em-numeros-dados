name: Publicar página (GitHub Pages)

# Publica a pasta site/ sempre que ela muda no main (inclusive pelos commits da atualização automática).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/publicar_pagina.yml"]
  workflow_run:
    workflows: ["Atualizar dados do Café em Números"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
